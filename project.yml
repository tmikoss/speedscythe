name: Speedscythe
options:
  bundleIdPrefix: lv.mikoss
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Speedscythe:
    type: application
    platform: macOS
    sources:
      - Speedscythe
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lv.mikoss.speedscythe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Speedscythe/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        HARVEST_CLIENT_ID: WxGxHAz8ykBWZi6ipb6e-MDX
        HARVEST_REDIRECT_URI: "http://127.0.0.1:47823/callback"
        HARVEST_USER_AGENT: "Speedscythe (https://github.com/tmikoss/speedscythe)"
  SpeedscytheTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SpeedscytheTests
    dependencies:
      - target: Speedscythe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lv.mikoss.speedscythe.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Speedscythe:
    build:
      targets:
        Speedscythe: all
        SpeedscytheTests: [test]
    test:
      targets:
        - SpeedscytheTests
